  /user/account/edit:
    post:
      consumes:
      - multipart/form-data
      description: Updates authenticated user's information
      parameters:
      - description: New first name
        in: formData
        name: firstName
        type: string
      - description: New last name
        in: formData
        name: lastName
        type: string
      - description: New email
        in: formData
        name: email
        type: string
      - description: New password (must be at least 8 characters)
        in: formData
        name: password
        type: string
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: User info updated successfully
          schema:
            type: string
        "400":
          description: Invalid input
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Error updating user
          schema:
            type: string
      summary: Edit user account information
      tags:
      - User
