    get:
      description: Returns the authenticated user's information
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: View user account information
      tags:
      - User
  /user/register:
    post:
      consumes:
      - multipart/form-data
      description: Registers an user on the DB
      parameters:
      - description: User's first name
        in: formData
        name: firstName
        required: true
        type: string
      - description: User's last name
        in: formData
        name: lastName
        required: true
        type: string
      - description: User's role (must be a valid role)
        in: formData
        name: role
        required: true
        type: string
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's plain password (must be at least 8 characters long)
        in: formData
        minLength: 8
        name: pass
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "201":
          description: User registered successfully
          schema:
            type: string
        "406":
          description: Error found on the form params
          schema:
            type: string
        "500":
          description: Error found on user registration
          schema:
            type: string
      summary: User registration
      tags:
      - User
      - Auth
