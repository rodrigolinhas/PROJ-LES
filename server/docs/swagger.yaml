basePath: /
definitions:
  api.LongEvent:
    properties:
      closed:
        example: false
        type: boolean
      description:
        example: Event's description.
        type: string
      endDate:
        example: "2026-03-07T20:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      location:
        example: Place
        type: string
      name:
        example: Event
        type: string
      organization:
        example: Org
        type: string
      organizerID:
        example: 2
        type: integer
      published:
        example: true
        type: boolean
      startDate:
        example: "2026-03-07T12:00:00Z"
        type: string
      theme:
        example: CompSci
        type: string
    type: object
  api.ShortEvent:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Event
        type: string
      theme:
        example: CompSci
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Local Scientific Event Manager System
  title: Scientific Event Manager API
  version: "0.1"
paths:
  /auth/google:
    get:
      description: Redirects the user to Google's OAuth2 consent screen for SSO login.
        If the user does not have an account, one will be created automatically upon
        callback.
      parameters:
      - description: OAuth provider (must be 'google')
        in: query
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "307":
          description: Redirect to Google consent screen
      summary: Begin Google SSO authentication
      tags:
      - Auth
  /auth/google/callback:
    get:
      description: Handles the OAuth2 callback from Google after user consent. Exchanges
        the authorization code for user info, creates a new account if the user does
        not exist, generates session and CSRF tokens, and redirects to the frontend.
      parameters:
      - description: Authorization code from Google
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state parameter
        in: query
        name: state
        required: true
        type: string
      - description: Granted OAuth scopes
        in: query
        name: scope
        required: true
        type: string
      produces:
      - text/html
      responses:
        "201":
          description: Event created with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during event creation
          schema:
            type: string
      summary: Google SSO callback
      tags:
      - Event
  /event/delete:
    post:
      consumes:
      - multipart/form-data
      description: A user can delete an event organized by them
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Event deleted with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "403":
          description: User is not the organizer of the event
          schema:
            type: string
        "404":
          description: Event not found
          schema:
            type: string
        "500":
          description: Error found during event deletion
          schema:
            type: string
      summary: Delete event
      tags:
      - Event
  /event/edit:
    post:
      consumes:
      - multipart/form-data
      description: A user can edit one of their events
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      - description: Event name
        in: formData
        name: name
        type: string
      - description: Event theme
        in: formData
        name: theme
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Organization responsable for the event
        in: formData
        name: organization
        type: string
      - description: Date/Time at which the event starts (RFC3339/ISO8601 format)
        in: formData
        name: startDate
        type: string
      - description: Date/Time at which the event ends (RFC3339/ISO8601 format)
        in: formData
        name: endDate
        type: string
      - description: Location where the event takes place
        in: formData
        name: location
        type: string
      produces:
      - text/plain
      responses:
        "201":
          description: Event edited with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during event editing
          schema:
            type: string
      summary: Edit event
      tags:
      - Event
  /event/list:
    get:
      consumes:
      - multipart/form-data
      description: A user can view and filter all published events
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Filter the name of the events shown
        in: formData
        name: filter
        type: string
      - default: 20
        description: Number of events shown
        in: formData
        maximum: 50
        name: limit
        type: integer
      - default: 0
        description: Number of skip in the search
        in: formData
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ShortEvent'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
      summary: List events
      tags:
      - Event
  /event/my:
    get:
      consumes:
      - multipart/form-data
      description: A user can view and filter all of their events
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Filter the name of the events shown
        in: formData
        name: filter
        type: string
      - default: 20
        description: Number of events shown
        in: formData
        maximum: 50
        name: limit
        type: integer
      - default: 0
        description: Number of skip in the search
        in: formData
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ShortEvent'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
      summary: List the user's event
      tags:
      - Event
  /event/publish:
    post:
      consumes:
      - multipart/form-data
      description: A user can publish an event organized by them, so that all users
        can view it
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Event published with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "403":
          description: User is not the organizer of the event
          schema:
            type: string
        "404":
          description: Event not found
          schema:
            type: string
        "409":
          description: Event already published
          schema:
            type: string
      summary: Publish event
      tags:
      - Event
  /event/view/:id:
    get:
      consumes:
      - multipart/form-data
      description: A user can view the information of an event that they own or was
        published
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LongEvent'
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
      summary: View event information
      tags:
      - Event
  /ping:
    get:
      description: Return "ping" and log the time in the DB
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Example ping endpoint
      tags:
      - Dev
  /user/login:
    post:
      consumes:
      - multipart/form-data
      description: Authenticates a user and generates session and CSRF tokens
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's password
        in: formData
        name: pass
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: User login with success
          schema:
            type: string
        "400":
          description: Missing email or password
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during user login
          schema:
            type: string
      summary: User login
      tags:
      - User
      - Auth
  /user/logout:
    post:
      description: Logs out the user, clears cookies and resets tokens in DB
      parameters:
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Logged out successfully!
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: User logout
      tags:
      - User
      - Auth
  /user/register:
    post:
      consumes:
      - multipart/form-data
      description: Registers an user on the DB
      parameters:
      - description: User's first name
        in: formData
        name: firstName
        required: true
        type: string
      - description: User's last name
        in: formData
        name: lastName
        required: true
        type: string
      - description: User's role (must be a valid role)
        in: formData
        name: role
        required: true
        type: string
      - description: User's email
        in: formData
        name: email
        required: true
        type: string
      - description: User's plain password (must be at least 8 characters long)
        in: formData
        minLength: 8
        name: pass
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "201":
          description: User registered successfully
          schema:
            type: string
        "406":
          description: Error found on the form params
          schema:
            type: string
        "500":
          description: Error found on user registration
          schema:
            type: string
      summary: User registration
      tags:
      - User
      - Auth
swagger: "2.0"
tags:
- description: Endpoints only available for development purposes
  name: Dev
- description: Endpoints related with user account management
  name: User
- description: Endpoints related with user authentication
  name: Auth
- description: Endpoints related to event management
  name: Event
