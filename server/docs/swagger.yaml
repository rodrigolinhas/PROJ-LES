host: localhost:8080
info:
  contact: {}
  description: Local Scientific Event Manager System
  title: Scientific Event Manager API
  version: "0.1"
paths:
  /article/addTags:
    post:
      consumes:
      - multipart/form-data
      description: While the user is logged in, adds one or more tags to an article
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the article
        in: formData
        name: articleID
        required: true
        type: string
      - description: The IDs of the tags, separated by commas
        in: formData
        name: tagsID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Tags added successfully
          schema:
            type: string
        "400":
          description: Invalid article/tag IDs
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: Article/tag not found
          schema:
            type: string
        "500":
          description: Error found while adding tags
          schema:
            type: string
      summary: Add tags to an article
      tags:
      - Article
  /article/create:
    post:
      consumes:
      - multipart/form-data
      description: While the user is logged in, creates an article and associates
        it to an event activity
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the associated event
        in: formData
        name: eventID
        required: true
        type: string
      - description: ID of the associated activity
        in: formData
        name: activityID
        required: true
        type: string
      - description: Title of the article
        in: formData
        name: title
        required: true
        type: string
      - description: ID of the article's first author
        in: formData
        name: firstAuthorID
        required: true
        type: string
      - description: The IDs of the co-authors, separated by commas
        in: formData
        name: coAuthorsID
        type: string
      - description: Publisher of the article
        in: formData
        name: publisher
        required: true
        type: string
      - description: Article's DOI
        in: formData
        name: doi
        type: string
      - description: Article's ISBN
        in: formData
        name: isbn
        type: string
      - description: URL where the article is accessible
        in: formData
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: The activity does not belong to the event
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: User/event/activity not found
          schema:
            type: string
        "500":
          description: Error found during article creation
          schema:
            type: string
      summary: Create article
      tags:
      - Article
  /article/details:
    get:
      description: Returns an article with its associated tags
      parameters:
      - description: Article ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LES_server_internal_models.Article'
        "400":
          description: Missing article ID
          schema:
            type: string
        "404":
          description: Article not found
          schema:
            type: string
        "500":
          description: Error while fetching article
          schema:
            type: string
      summary: Get article by ID
      tags:
      - Article
  /article/removeTags:
    post:
      consumes:
      - multipart/form-data
      description: While the user is logged in, removes one or more tags from an article
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the article
        in: formData
        name: articleID
        required: true
        type: string
      - description: The IDs of the tags, separated by commas
        in: formData
        name: tagsID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Tags removed successfully
          schema:
            type: string
        "400":
          description: Invalid article/tag IDs
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: Article/tag not found
          schema:
            type: string
        "500":
          description: Error found while removing tags
          schema:
            type: string
      summary: Remove tags from an article
      tags:
      - Article
  /auth/google:
    get:
      description: Redirects the user to Google's OAuth2 consent screen for SSO login.
        If the user does not have an account, one will be created automatically upon
        callback.
      parameters:
      - description: OAuth provider (must be 'google')
        in: query
        name: provider
        required: true
        type: string
      produces:
      - text/html
      responses:
        "307":
          description: Redirect to Google consent screen
      summary: Begin Google SSO authentication
      tags:
      - Auth
  /auth/google/callback:
    get:
      description: Handles the OAuth2 callback from Google after user consent. Exchanges
        the authorization code for user info, creates a new account if the user does
        not exist, generates session and CSRF tokens, and redirects to the frontend.
      parameters:
      - description: Authorization code from Google
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state parameter
        in: query
        name: state
        required: true
        type: string
      - description: Granted OAuth scopes
        in: query
        name: scope
        required: true
        type: string
      produces:
      - text/html
      responses:
        "307":
          description: Redirect to frontend with session cookies set
        "400":
          description: Missing authorization code
          schema:
            type: string
        "500":
          description: OAuth or user creation error
          schema:
            type: string
      summary: Google SSO callback
      tags:
      - Auth
  /event/activity/create:
    post:
      consumes:
      - multipart/form-data
      description: While the user is logged in, creates an activity associated with
        an event and registers it in the database
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Activity name
        in: formData
        name: name
        required: true
        type: string
      - description: Activity description
        in: formData
        name: description
        required: true
        type: string
      - description: Event ID of the associated event
        in: formData
        name: eventID
        required: true
        type: string
      - description: Date/Time at which the activity starts (RFC3339/ISO8601 format)
        in: formData
        name: startDate
        required: true
        type: string
      - description: Date/Time at which the activity ends (RFC3339/ISO8601 format)
        in: formData
        name: endDate
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "201":
          description: Activity created with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during activity creation
          schema:
            type: string
      summary: Create activity
      tags:
      - EventActivity
  /event/activity/delete:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Activity ID
        in: formData
        name: activityID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Deleted
          schema:
            type: string
      summary: Delete activity
      tags:
      - EventActivity
  /event/activity/edit:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Activity ID
        in: formData
        name: activityID
        required: true
        type: string
      - description: Name
        in: formData
        name: name
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Updated
          schema:
            type: string
      summary: Edit activity
      tags:
      - EventActivity
  /event/activity/list:
    get:
      consumes:
      - text/plain
      description: A user can view all the event's activities
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Event ID
        in: query
        name: eventID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.EventActivity'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No activity found
          schema:
            type: string
      summary: List activities of an event
      tags:
      - EventActivity
  /event/activity/view/:id:
    get:
      description: View details of a specific activity
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Activity not found
          schema:
            type: string
      summary: View activity
      tags:
      - EventActivity
  /event/create:
    post:
      consumes:
      - multipart/form-data
      description: While the user is logged in, creates an event and registers it
        in the database
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Event name
        in: formData
        name: name
        required: true
        type: string
      - description: Event theme
        in: formData
        name: theme
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        required: true
        type: string
      - description: Organization responsable for the event
        in: formData
        name: organization
        required: true
        type: string
      - description: Date/Time at which the event starts (RFC3339/ISO8601 format)
        in: formData
        name: startDate
        required: true
        type: string
      - description: Date/Time at which the event ends (RFC3339/ISO8601 format)
        in: formData
        name: endDate
        required: true
        type: string
      - description: Location where the event takes place
        in: formData
        name: location
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "201":
          description: Event created with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during event creation
          schema:
            type: string
      summary: Create event
      tags:
      - Event
  /event/delete:
    post:
      consumes:
      - multipart/form-data
      description: A user can delete an event organized by them
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Event deleted with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "403":
          description: User is not the organizer of the event
          schema:
            type: string
        "404":
          description: Event not found
          schema:
            type: string
        "500":
          description: Error found during event deletion
          schema:
            type: string
      summary: Delete event
      tags:
      - Event
  /event/edit:
    post:
      consumes:
      - multipart/form-data
      description: A user can edit one of their events
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      - description: Event name
        in: formData
        name: name
        type: string
      - description: Event theme
        in: formData
        name: theme
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Organization responsable for the event
        in: formData
        name: organization
        type: string
      - description: Date/Time at which the event starts (RFC3339/ISO8601 format)
        in: formData
        name: startDate
        type: string
      - description: Date/Time at which the event ends (RFC3339/ISO8601 format)
        in: formData
        name: endDate
        type: string
      - description: Location where the event takes place
        in: formData
        name: location
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Event edited with success
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Error found during event editing
          schema:
            type: string
      summary: Edit event
      tags:
      - Event
  /event/list:
    get:
      consumes:
      - text/plain
      description: A user can view and filter all published events
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Filter the name of the events shown
        in: query
        name: filter
        type: string
      - default: 20
        description: Number of events shown
        in: query
        maximum: 50
        name: limit
        type: integer
      - default: 0
        description: Number of events to skip in the search
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.ShortEvent'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
      summary: List events
      tags:
      - Event
  /event/my:
    get:
      consumes:
      - text/plain
      description: A user can view and filter all of their events
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Filter the name of the events shown
        in: query
        name: filter
        type: string
      - default: 20
        description: Number of events shown
        in: query
        maximum: 50
        name: limit
        type: integer
      - default: 0
        description: Number of events to skip in the search
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.ShortEvent'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
      summary: List the user's event
      tags:
      - Event
  /event/my/enroll:
    get:
      consumes:
      - text/plain
      description: A user can view and filter all events that they enrolled in
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Filter the name of the events shown
        in: query
        name: filter
        type: string
      - default: 20
        description: Number of events shown
        in: query
        maximum: 50
        name: limit
        type: integer
      - default: 0
        description: Number of events to skip in the search
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.ShortEventEnroll'
            type: array
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: No event found
          schema:
            type: string
        "500":
          description: Error found on query
          schema:
            type: string
      summary: List the user's enrolled event
      tags:
      - Event
  /event/pay:
    post:
      consumes:
      - multipart/form-data
      description: Dummy endpoint for paying the fee for enrolling in a event
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      - description: PayToken given during event enrollment
        in: formData
        name: PayToken
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Event registration payed successfully
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "404":
          description: Registration not found
          schema:
            type: string
        "409":
          description: Registration has already been paid
          schema:
            type: string
        "500":
          description: Error found during event payment confirmation
          schema:
            type: string
      summary: Pay event enrollment fee
      tags:
      - Event
      - Dev
  /event/publish:
    post:
      consumes:
      - multipart/form-data
      description: A user can publish an event organized by them, so that all users
        can view it
      parameters:
      - description: User's CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: ID of the event
        in: formData
        name: eventID
        required: true
        type: string
      produces:
