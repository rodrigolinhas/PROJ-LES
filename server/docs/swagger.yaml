    post:
      description: Logs out the user, clears cookies and resets tokens in DB
      parameters:
      - description: CSRF Token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Logged out successfully!
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: User logout
      tags:
      - User
      - Auth
